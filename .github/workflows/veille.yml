# Collecte quotidienne de la veille (docs/VEILLE.md) : npm run veille:collecte
#
# Jours ouvrés (lundi à vendredi) à 6 h 30 heure de Paris, déclenchement manuel (« Run workflow ») et à chaque
# modification sur main d'un réglage saisi à la main (catalogue, mots-clés, échéances, suivi des textes).
# Couches A (flux) et B (API officielles gratuites), alertes Google, calendrier fiscal, suivi PLF / PLFSS (Assemblée
# et Sénat) et leurs principales mesures : coût 0 €, aucun service d'IA.
# Publie public/news.json, public/veille-etat.json et public/archives/, les commit seulement
# s'ils ont changé, puis déclenche le déploiement GitHub Pages.
#
# Secrets facultatifs (Settings > Secrets and variables > Actions) :
#  - PISTE_CLIENT_ID et PISTE_CLIENT_SECRET : API de la couche B (l'API de l'INSEE et celle
#    du BODACC sont ouvertes, sans clé) ;
#  - ALERTES_RSS : flux d'alertes Google, une ligne « Thème|URL » par flux.
# Une source sans ses identifiants est sautée et signalée « non configurée » dans veille-etat.json.

name: Veille · collecte quotidienne

on:
  schedule:
    # Le cron de GitHub est en UTC. 6 h 30 à Paris = 04:30 UTC en heure d'été (UTC+2),
    # 05:30 UTC en heure d'hiver (UTC+1). Les deux sont programmés ; l'étape « Heure de Paris »
    # ne laisse passer que celui qui correspond à l'heure légale du jour.
    - cron: '30 4 * * 1-5'
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
  # Une modification des réglages saisis à la main sur main est appliquée tout de suite.
  push:
    branches: [main]
    paths:
      - 'veille/sources.json'
      - 'veille/mots-cles.json'
      - 'veille/config.json'
      - 'veille/echeances.json'
      - 'veille/suivi-textes.json'
      - 'veille/indicateurs.json'
      - 'veille/hierarchie-mesures.json'

permissions:
  contents: write # commit des fichiers publiés
  actions: write # déclenchement du workflow de déploiement

concurrency:
  group: veille-collecte
  cancel-in-progress: false

jobs:
  collecte:
    name: Collecter et publier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Heure de Paris
        id: heure
        env:
          EVENEMENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENEMENT" != "schedule" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # +0200 en heure d'été, +0100 en heure d'hiver.
          if [ "$(TZ=Europe/Paris date +%z)" = "+0200" ]; then attendu='30 4 * * 1-5'; else attendu='30 5 * * 1-5'; fi
          if [ "$CRON" = "$attendu" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          else
            echo "lancer=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déclenchement « $CRON » ignoré : il n'est pas 6 h 30 à Paris aujourd'hui."
          fi

      - name: Récupérer le dépôt
        if: steps.heure.outputs.lancer == 'true'
        uses: actions/checkout@v7
        with:
          # Historique complet : le recalage avant l'envoi (git pull --rebase) en a besoin.
          fetch-depth: 0

      - name: Installer Node.js
        if: steps.heure.outputs.lancer == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        if: steps.heure.outputs.lancer == 'true'
        run: npm ci

      - name: Collecter
        if: steps.heure.outputs.lancer == 'true'
        # Identifiants des API de la couche B et adresses des alertes Google, transmis à cette seule étape.
        # GitHub les masque dans les journaux et le script ne cite que leurs noms. Un secret absent donne une valeur vide.
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
          ALERTES_RSS: ${{ secrets.ALERTES_RSS }}
        run: npm run veille:collecte

      - name: Publier si les fichiers ont changé
        id: publication
        if: steps.heure.outputs.lancer == 'true'
        run: |
          for chemin in public/news.json public/veille-etat.json public/archives; do
            if [ -e "$chemin" ]; then git add "$chemin"; fi
          done
          if git diff --cached --quiet; then
            echo "publie=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun changement à publier."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Veille : collecte du $(TZ=Europe/Paris date +%d/%m/%Y)"
          # Une autre modification a pu arriver pendant la collecte : on se recale avant d'envoyer.
          for essai in 1 2 3; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "publie=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 5))
          done
          echo "::error::Envoi des fichiers de veille impossible après 3 essais."
          exit 1

      - name: Déclencher le déploiement
        # Un commit fait avec le jeton du workflow ne relance pas les autres workflows :
        # on déclenche donc explicitement le déploiement (main et beta sont publiés ensemble).
        if: steps.publication.outputs.publie == 'true' && (github.ref_name == 'main' || github.ref_name == 'beta')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploiement.yml --ref main
